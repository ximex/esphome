---
esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: 17
  rx_pin: 16
  baud_rate: 9600

benq:
  id: benq_hub
  model: SP840

number:
  - platform: benq
    id: volume
    name: Volume
    command: VOLUME

select:
  - platform: benq
    id: aspect_ratio
    name: Aspect Ratio
    command: ASPECT_RATIO

switch:
  - platform: benq
    id: blank
    name: Blank
    command: BLANK

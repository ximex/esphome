benq:
  model: SP840
  update_interval: 60s
  command_timeout: 5s

switch:
  - platform: benq
    name: "Projector Power"
    command: POWER

  - platform: benq
    name: "Blank Screen"
    command: BLANK

  - platform: benq
    name: "Mute Audio"
    command: MUTE

  - platform: benq
    name: "Freeze Image"
    command: FREEZE

  - platform: benq
    name: "On Screen Menu"
    command: MENU

select:
  - platform: benq
    name: "Input Source"
    command: SOURCE

  - platform: benq
    name: "Picture Mode"
    command: PICTURE_MODE

  - platform: benq
    name: "Lamp Mode"
    command: LAMP_MODE

  - platform: benq
    name: "Aspect Ratio"
    command: ASPECT_RATIO

number:
  - platform: benq
    name: "Volume"
    command: VOLUME

  - platform: benq
    name: "Brightness"
    command: BRIGHTNESS

  - platform: benq
    name: "Contrast"
    command: CONTRAST

  - platform: benq
    name: "Color"
    command: COLOR

  - platform: benq
    name: "Sharpness"
    command: SHARPNESS

# More sensors than the old fixed capacity of four, to prove none get dropped
sensor:
  - platform: benq
    name: "Lamp Hours"
    command: LAMP_TIME

  - platform: benq
    name: "Volume Level"
    command: VOLUME

  - platform: benq
    name: "Brightness Level"
    command: BRIGHTNESS

  - platform: benq
    name: "Contrast Level"
    command: CONTRAST

  - platform: benq
    name: "Color Level"
    command: COLOR

button:
  - platform: benq
    name: "Menu Up"
    command: UP

  - platform: benq
    name: "Menu Enter"
    command: ENTER

  - platform: benq
    name: "Auto Adjust"
    command: AUTO

  - platform: benq
    name: "Reset Lamp Hours"
    command: LAMP_HOUR_RESET

  # A command without a platform of its own, sent through the escape hatch
  - platform: benq
    name: "Set 115200 Baud"
    command: BAUD_RATE
    value: "115200"

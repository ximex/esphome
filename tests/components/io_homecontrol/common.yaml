cc1101:
  id: cc1101_radio
  cs_pin: ${cs_pin}
  gdo0_pin:
    number: ${gdo0_pin}
    mode: INPUT
  frequency: 868.95MHz
  modulation_type: 2-FSK
  symbol_rate: 38400
  fsk_deviation: 19.2kHz
  filter_bandwidth: 203kHz
  sync_mode: None
  num_preamble: 0
  packet_mode: false

io_homecontrol:
  id: iohc_hub
  cc1101_id: cc1101_radio
  gdo0_pin: ${gdo0_pin_num}
  source_address: 0xAABBCC
  key: "0102030405060708090A0B0C0D0E0F10"
  tx_repeats: 4

cover:
  - platform: io_homecontrol
    io_homecontrol_id: iohc_hub
    name: "Test Blind 1"
    address: 0xAABBCC
  - platform: io_homecontrol
    io_homecontrol_id: iohc_hub
    name: "Test Blind 2"
    address:
      - 0xAABBCC
      - 0xDDEEFF

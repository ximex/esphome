substitutions:
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  gdo0_pin_num: "4"

packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

cc1101:
  id: cc1101_radio
  cs_pin: ${cs_pin}
  gdo0_pin:
    number: ${gdo0_pin}
    mode: INPUT
  frequency: 868.95MHz
  modulation_type: 2-FSK
  symbol_rate: 38400
  fsk_deviation: 19.2kHz
  filter_bandwidth: 203kHz
  sync_mode: None
  num_preamble: 0
  packet_mode: false

io_homecontrol:
  id: iohc_hub
  cc1101_id: cc1101_radio
  gdo0_pin: ${gdo0_pin_num}
  pairing_mode: true
